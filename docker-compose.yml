# docker-compose.yml

services:
  db:
    image: postgres:15-alpine
    container_name: starpass_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: starpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: starpass_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: starpass_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=starpass
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - SECRET_KEY=replace-with-a-secure-random-secret-key-in-production
      - TMDB_API_KEY=0eeb2f60b6fa5401315ad7549ce42530
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/starpass
      - REDIS_URL=redis://redis:6379/0
    
  frontend:
    build: ./frontend
    container_name: starpass_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

volumes:
  postgres_data: